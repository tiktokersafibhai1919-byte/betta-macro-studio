<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betta Macro Studio | Studio by Mr Safi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #eaedf2;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 18px 14px 28px;
            line-height: 1.4;
        }

        .camera-app {
            max-width: 460px;
            margin: 0 auto;
        }

        .studio-header {
            text-align: center;
            margin-bottom: 14px;
        }

        .studio-header h1 {
            font-size: 1.38rem;
            font-weight: 800;
            letter-spacing: 1.4px;
            color: #0f172a;
        }

        .creator-sub {
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
            margin-top: 2px;
        }

        /* API Key Bar */
        .api-card {
            background-color: #ffffff;
            border-radius: 14px;
            padding: 10px 12px;
            border: 1px solid #dce1e9;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .api-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .api-top span {
            font-size: 0.78rem;
            font-weight: 700;
            color: #1e293b;
        }

        .key-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 99px;
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .key-badge.active {
            background-color: #dcfce7;
            color: #15803d;
        }

        .api-input-row {
            display: flex;
            gap: 6px;
        }

        .api-input-row input {
            flex: 1;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 0.8rem;
            background-color: #f8fafc;
            outline: none;
        }

        .save-key-btn {
            background-color: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 7px 12px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* Viewfinder */
        .viewfinder-card {
            background-color: #ffffff;
            border-radius: 18px;
            padding: 10px 10px 12px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
            border: 1px solid #dce1e9;
            margin-bottom: 14px;
        }

        .screen-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 5;
            background-color: #07090d;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screen-frame.ratio-9-16 {
            aspect-ratio: 9 / 16;
        }

        .screen-frame.ratio-1-1 {
            aspect-ratio: 1 / 1;
        }

        .grid-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.18) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.18) 1px, transparent 1px);
            background-size: 33.333% 33.333%;
        }

        #bettaPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            z-index: 2;
        }

        .hidden {
            display: none !important;
        }

        .placeholder-box {
            text-align: center;
            color: #94a3b8;
            z-index: 2;
            padding: 20px;
        }

        .focus-bracket {
            width: 58px;
            height: 58px;
            margin: 0 auto 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            border-radius: 8px;
            position: relative;
        }

        .focus-bracket::after {
            content: "+";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.65);
            font-size: 1.1rem;
        }

        #statusLabel {
            font-family: 'Courier New', monospace;
            font-size: 0.74rem;
            letter-spacing: 0.6px;
            color: #cbd5e1;
        }

        .hud-bottom {
            position: absolute;
            bottom: 10px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            font-family: 'Courier New', monospace;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.88);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
            z-index: 4;
            pointer-events: none;
        }

        .lens-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 6px 2px;
        }

        .lens-specs {
            font-size: 0.8rem;
            font-weight: 700;
            color: #1e293b;
        }

        .rec-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background-color: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }

        .rec-dot.pulsing {
            animation: pulseRec 0.7s infinite alternate;
        }

        @keyframes pulseRec {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.3; transform: scale(0.8); }
        }

        /* Controls */
        .controls-panel {
            background-color: #ffffff;
            border-radius: 16px;
            border: 1px solid #dce1e9;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.04);
            overflow: hidden;
            margin-bottom: 16px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 1px solid #eef1f6;
            gap: 10px;
        }

        .control-row label {
            font-size: 0.86rem;
            font-weight: 600;
            color: #1e293b;
            white-space: nowrap;
        }

        .control-row select {
            flex: 1;
            max-width: 62%;
            border: none;
            background-color: #f1f5f9;
            color: #0f172a;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 8px 10px;
            border-radius: 8px;
            text-align: right;
            outline: none;
        }

        .prompt-box-row {
            padding: 12px 14px;
            background-color: #f8fafc;
        }

        .prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .prompt-header label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #0f172a;
        }

        .clear-prompt-btn {
            background: none;
            border: none;
            color: #2563eb;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            padding: 2px 6px;
        }

        #customPromptInput {
            width: 100%;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            color: #0f172a;
            border-radius: 10px;
            padding: 10px;
            font-family: inherit;
            font-size: 0.84rem;
            resize: vertical;
            outline: none;
        }

        #customPromptInput:focus {
            border-color: #2563eb;
        }

        .shutter-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .shutter-btn {
            flex: 1.4;
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border: none;
            border-radius: 999px;
            padding: 14px 18px;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.32);
        }

        .shutter-btn:disabled {
            opacity: 0.65;
        }

        .icon-btn {
            flex: 1;
            background-color: #ffffff;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            padding: 12px 8px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
        }

        .studio-footer {
            text-align: center;
            margin-top: 18px;
            font-size: 0.78rem;
            color: #64748b;
        }

        .studio-footer strong {
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="camera-app">
        <header class="studio-header">
            <h1>BETTA MACRO STUDIO</h1>
            <p class="creator-sub">Studio by Mr Safi</p>
        </header>

        <!-- API Key Connector -->
        <section class="api-card">
            <div class="api-top">
                <span>FLUX.1 Optical Engine Token</span>
                <span id="keyStatusBadge" class="key-badge">KEY REQUIRED</span>
            </div>
            <div class="api-input-row">
                <input type="password" id="apiKeyInput" placeholder="Paste free hf_... token here">
                <button type="button" class="save-key-btn" onclick="saveApiKey()">Save Key</button>
            </div>
        </section>

        <!-- Camera Viewfinder -->
        <section class="viewfinder-card">
            <div class="screen-frame ratio-9-16" id="screenFrame">
                <div class="grid-overlay"></div>
                <img id="bettaPreview" src="" alt="Studio Preview" class="hidden">

                <div id="placeholderState" class="placeholder-box">
                    <div class="focus-bracket"></div>
                    <p id="statusLabel">PASTE FREE KEY &amp; TAP GENERATE</p>
                </div>

                <div class="hud-bottom">
                    <span>FLUX.1 • 100mm f/2.8</span>
                    <span id="aspectHud">9:16 RAW</span>
                </div>
            </div>

            <div class="lens-bar">
                <span class="lens-specs" id="lensModeLabel">Betta Splendens Macro • No Watermark</span>
                <span id="recDot" class="rec-dot"></span>
            </div>
        </section>

        <!-- Controls -->
        <section class="controls-panel">
            <div class="control-row">
                <label for="varietySelect">Betta Variety</label>
                <select id="varietySelect">
                    <option value="slender Siamese fighting fish (Betta splendens) Halfmoon male with a huge 180-degree symmetrical D-shaped flowing silk tail fin">Halfmoon (180° Tail)</option>
                    <option value="slender Siamese fighting fish (Betta splendens) Crowntail male with dramatic spiky needle-like ray-extended fins">Crowntail (Spiky Rays)</option>
                    <option value="muscular short-fin Plakat Siamese fighting fish (Betta splendens) flaring its gill beard">Plakat (Short-Fin)</option>
                    <option value="slender Galaxy Koi Siamese fighting fish (Betta splendens) with marbled iridescent metallic scales and flowing veil fins">Galaxy Koi</option>
                    <option value="slender Dumbo Big Ear Siamese fighting fish (Betta splendens) with oversized ruffled white pectoral fins and long flowing tail">Dumbo Ear</option>
                    <option value="slender Alien Hybrid Siamese fighting fish (Betta splendens) with iridescent metallic green-blue dragon scales">Alien Metallic</option>
                </select>
            </div>

            <div class="control-row">
                <label for="colorSelect">Color Morph</label>
                <select id="colorSelect">
                    <option value="iridescent royal blue slender body with vibrant mustard yellow-gold silk fins">Mustard Gas (Blue &amp; Gold)</option>
                    <option value="velvet matte black body with metallic silver platinum dragon scales">Samurai Black &amp; Silver</option>
                    <option value="deep crimson blood-red translucent veil fins with copper metallic sheen">Crimson Copper Red</option>
                    <option value="pearl white platinum body with glowing cyan bioluminescent fin edges">Platinum Cyan Glow</option>
                    <option value="multicolor koi orange, black, white, and electric turquoise marbled patches">Candy Koi Marbled</option>
                </select>
            </div>

            <div class="control-row">
                <label for="lightingSelect">Studio Lighting</label>
                <select id="lightingSelect">
                    <option value="isolated against a pure pitch-black obsidian studio backdrop, dramatic rim lighting illuminating delicate fin membranes">Obsidian Black Studio</option>
                    <option value="dark moody underwater aquascape background with subtle volumetric light rays and tiny rising micro bubbles">Deep Aquarium Rays</option>
                    <option value="ultra-clean backlit macro studio lighting showing translucent vein structure inside the flowing fins">Translucent Backlit X-Ray</option>
                </select>
            </div>

            <div class="control-row">
                <label for="ratioSelect">Frame Ratio</label>
                <select id="ratioSelect" onchange="updateAspectLabel()">
                    <option value="9:16">9:16 Vertical (Reels / Wallpaper)</option>
                    <option value="1:1">1:1 Square (Instagram)</option>
                    <option value="4:5">4:5 Portrait (Poster)</option>
                </select>
            </div>

            <div class="prompt-box-row">
                <div class="prompt-header">
                    <label for="customPromptInput">Custom Prompt (Optional — Any Scene)</label>
                    <button type="button" class="clear-prompt-btn" onclick="clearCustomPrompt()">Clear</button>
                </div>
                <textarea id="customPromptInput" rows="2" oninput="updateModeIndicator()" placeholder="Leave empty for Betta presets, or type any custom scene..."></textarea>
            </div>
        </section>

        <div class="shutter-bar">
            <button id="copyPromptBtn" class="icon-btn" onclick="copyMotionPrompt()">📋 Motion</button>
            <button id="generateBtn" class="shutter-btn" onclick="generateBettaPhoto()">GENERATE</button>
            <button id="downloadBtn" class="icon-btn" onclick="downloadBettaImage()">⬇️ Save HD</button>
        </div>

        <footer class="studio-footer">
            FLUX.1 Neural Engine • Engineered by <strong>Mr Safi</strong>
        </footer>
    </div>

    <script>
        let currentBlobUrl = "";

        window.addEventListener("DOMContentLoaded", () => {
            const savedKey = localStorage.getItem("betta_studio_api_key");
            if (savedKey) {
                document.getElementById("apiKeyInput").value = savedKey;
                setKeyBadgeActive(true);
                document.getElementById("statusLabel").innerText = "READY TO CAPTURE • TAP GENERATE";
            }
        });

        function setKeyBadgeActive(isActive) {
            const badge = document.getElementById("keyStatusBadge");
            if (isActive) {
                badge.innerText = "KEY SAVED";
                badge.classList.add("active");
            } else {
                badge.innerText = "KEY REQUIRED";
                badge.classList.remove("active");
            }
        }

        function saveApiKey() {
            const keyVal = document.getElementById("apiKeyInput").value.trim();
            if (!keyVal) {
                alert("Please paste your free Hugging Face (hf_...) or Pollinations token first.");
                return;
            }
            localStorage.setItem("betta_studio_api_key", keyVal);
            setKeyBadgeActive(true);
            document.getElementById("statusLabel").innerText = "KEY SAVED • TAP GENERATE";
        }

        function updateAspectLabel() {
            const ratio = document.getElementById("ratioSelect").value;
            const hud = document.getElementById("aspectHud");
            const frame = document.getElementById("screenFrame");

            hud.innerText = `${ratio} RAW`;
            frame.classList.remove("ratio-9-16", "ratio-1-1");

            if (ratio === "9:16") frame.classList.add("ratio-9-16");
            else if (ratio === "1:1") frame.classList.add("ratio-1-1");
        }

        function updateModeIndicator() {
            const customVal = document.getElementById("customPromptInput").value.trim();
            const lensLabel = document.getElementById("lensModeLabel");
            lensLabel.innerText = customVal.length > 0
                ? "Custom Scene Mode • FLUX.1 RAW"
                : "Betta Splendens Macro • No Watermark";
        }

        function clearCustomPrompt() {
            document.getElementById("customPromptInput").value = "";
            updateModeIndicator();
        }

        function buildFinalPrompt() {
            const customPrompt = document.getElementById("customPromptInput").value.trim();
            if (customPrompt.length > 0) {
                return `${customPrompt}, ultra-realistic 8K RAW photography, cinematic studio lighting, sharp focus`;
            }

            const variety = document.getElementById("varietySelect").value;
            const color = document.getElementById("colorSelect").value;
            const lighting = document.getElementById("lightingSelect").value;

            return `Award-winning National Geographic macro wildlife photograph of a single ${variety} with ${color}, side-profile view suspended gracefully in crystal-clear water, ${lighting}, razor-sharp focus on glistening iridescent scales, gill plate, and delicate translucent fin rays, shot on 100mm macro lens f/2.8, photorealistic aquatic photography`;
        }

        function getDimensions(ratio) {
            if (ratio === "9:16") return { width: 768, height: 1344 };
            if (ratio === "1:1") return { width: 1024, height: 1024 };
            return { width: 896, height: 1120 };
        }

        async function fetchHuggingFaceImage(token, prompt, width, height) {
            const endpoints = [
                "https://router.huggingface.co/hf-inference/models/black-forest-labs/FLUX.1-schnell",
                "https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell"
            ];

            for (const url of endpoints) {
                const res = await fetch(url, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        inputs: prompt,
                        parameters: { width, height }
                    })
                });

                if (res.ok) {
                    return await res.blob();
                }
