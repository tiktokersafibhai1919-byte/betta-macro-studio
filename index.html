<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betta Macro Studio | Studio by Mr Safi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#eaedf2;color:#111827;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:16px 14px 28px}
.app{max-width:460px;margin:0 auto}
header{text-align:center;margin-bottom:14px}
header h1{font-size:1.35rem;font-weight:800;letter-spacing:1.4px;color:#0f172a}
header p{font-size:.84rem;font-weight:600;color:#64748b;margin-top:2px}
.card{background:#fff;border-radius:16px;padding:11px 12px;border:1px solid #dce1e9;margin-bottom:12px;box-shadow:0 6px 18px rgba(15,23,42,.05)}
.api-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:.78rem;font-weight:700}
.badge{font-size:.7rem;padding:2px 8px;border-radius:99px;background:#fee2e2;color:#b91c1c}
.badge.ok{background:#dcfce7;color:#15803d}
.row-in{display:flex;gap:6px}
.row-in input{flex:1;border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;font-size:.82rem;background:#f8fafc;outline:none}
.btn-dark{background:#0f172a;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:.8rem;font-weight:700;cursor:pointer}
.btn-dark.ok{background:#16a34a}
.screen{position:relative;width:100%;aspect-ratio:9/16;background:#07090d;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.screen.r1{aspect-ratio:1/1}.screen.r4{aspect-ratio:4/5}
.grid{position:absolute;inset:0;pointer-events:none;z-index:3;background-image:linear-gradient(to right,rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.18) 1px,transparent 1px);background-size:33.33% 33.33%}
#pic{width:100%;height:100%;object-fit:cover;z-index:2}
.hide{display:none!important}
.ph{text-align:center;color:#cbd5e1;z-index:2;padding:18px;font-family:monospace;font-size:.75rem}
.box{width:54px;height:54px;margin:0 auto 10px;border:1.5px solid rgba(255,255,255,.45);border-radius:8px}
.hud{position:absolute;bottom:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-family:monospace;font-size:.72rem;color:#fff;text-shadow:0 1px 4px #000;z-index:4}
.lens{display:flex;justify-content:space-between;align-items:center;padding:9px 4px 2px;font-size:.8rem;font-weight:700}
.dot{width:11px;height:11px;border-radius:50%;background:#ef4444}
.dot.pulse{animation:p .7s infinite alternate}@keyframes p{from{opacity:1}to{opacity:.25}}
.ctrl{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid #eef1f6;gap:8px}
.ctrl label{font-size:.84rem;font-weight:600}
.ctrl select{flex:1;max-width:62%;border:none;background:#f1f5f9;color:#0f172a;font-size:.81rem;font-weight:600;padding:8px;border-radius:8px;text-align:right}
.pbox{padding-top:10px}
.phead{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;margin-bottom:6px}
.phead button{background:none;border:none;color:#2563eb;font-weight:700;cursor:pointer}
textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px;font-family:inherit;font-size:.83rem}
.bar{display:flex;gap:8px;margin-top:4px}
.go{flex:1.4;background:#2563eb;color:#fff;border:none;border-radius:99px;padding:14px;font-size:.92rem;font-weight:700;letter-spacing:1px;cursor:pointer}
.go:disabled{opacity:.6}
.sub{flex:1;background:#fff;color:#1e293b;border:1px solid #cbd5e1;border-radius:99px;padding:12px 8px;font-size:.76rem;font-weight:700;cursor:pointer}
footer{text-align:center;margin-top:16px;font-size:.78rem;color:#64748b}
</style>
</head>
<body>
<div class="app">
<header><h1>BETTA MACRO STUDIO</h1><p>Studio by Mr Safi</p></header>

<div class="card">
<div class="api-top"><span>FLUX.1 Engine Token</span><span id="badge" class="badge">KEY REQUIRED</span></div>
<div class="row-in">
<input type="text" id="keyIn" placeholder="Paste hf_... token here">
<button type="button" id="saveBtn" class="btn-dark" onclick="saveKey()">Save Key</button>
</div>
</div>

<div class="card">
<div class="screen" id="scr">
<div class="grid"></div>
<img id="pic" class="hide" alt="Betta">
<div id="ph" class="ph"><div class="box"></div><div id="st">PASTE TOKEN &amp; TAP GENERATE</div></div>
<div class="hud"><span>FLUX.1 • 100mm f/2.8</span><span id="hudR">9:16 RAW</span></div>
</div>
<div class="lens"><span id="modeTxt">Betta Splendens Macro • 8K RAW</span><span id="dot" class="dot"></span></div>
</div>

<div class="card">
<div class="ctrl"><label>Betta Variety</label><select id="vSel">
<option value="slender Siamese fighting fish (Betta splendens) Halfmoon male with huge 180-degree symmetrical flowing silk tail fin">Halfmoon (180° Tail)</option>
<option value="slender Siamese fighting fish (Betta splendens) Crowntail male with spiky needle-like ray-extended fins">Crowntail (Spiky Rays)</option>
<option value="muscular short-fin Plakat Siamese fighting fish (Betta splendens) flaring gill beard">Plakat (Short-Fin)</option>
<option value="slender Galaxy Koi Siamese fighting fish (Betta splendens) with marbled iridescent metallic scales">Galaxy Koi</option>
<option value="slender Dumbo Big Ear Siamese fighting fish (Betta splendens) with oversized ruffled white pectoral fins">Dumbo Ear</option>
<option value="slender Alien Hybrid Siamese fighting fish (Betta splendens) with metallic green-blue dragon scales">Alien Metallic</option>
</select></div>
<div class="ctrl"><label>Color Morph</label><select id="cSel">
<option value="iridescent royal blue slender body with vibrant mustard yellow-gold silk fins">Mustard Gas (Blue &amp; Gold)</option>
<option value="velvet matte black body with metallic silver platinum dragon scales">Samurai Black &amp; Silver</option>
<option value="deep crimson blood-red translucent veil fins with copper sheen">Crimson Copper Red</option>
<option value="pearl white platinum body with glowing cyan bioluminescent fin edges">Platinum Cyan Glow</option>
<option value="multicolor koi orange, black, white, and electric turquoise marbled patches">Candy Koi Marbled</option>
</select></div>
<div class="ctrl"><label>Lighting</label><select id="lSel">
<option value="isolated against a pure pitch-black obsidian studio backdrop, dramatic rim lighting">Obsidian Black Studio</option>
<option value="dark moody underwater aquascape background with volumetric light rays and micro bubbles">Deep Aquarium Rays</option>
<option value="ultra-clean backlit macro studio lighting showing translucent fin veins">Translucent Backlit</option>
</select></div>
<div class="ctrl"><label>Frame Ratio</label><select id="rSel" onchange="setRatio()">
<option value="9:16">9:16 Vertical (Reels)</option>
<option value="1:1">1:1 Square (Instagram)</option>
<option value="4:5">4:5 Portrait (Poster)</option>
</select></div>
<div class="pbox">
<div class="phead"><span>Custom Prompt (Optional)</span><button type="button" onclick="clrP()">Clear</button></div>
<textarea id="cIn" rows="2" oninput="chkM()" placeholder="Leave empty for Betta presets, or type any scene..."></textarea>
</div>
</div>

<div class="bar">
<button type="button" id="cpBtn" class="sub" onclick="cpMot()">📋 Motion</button>
<button type="button" id="goBtn" class="go" onclick="runGen()">GENERATE</button>
<button type="button" class="sub" onclick="dlImg()">⬇️ Save HD</button>
</div>
<footer>FLUX.1 Neural Engine • Engineered by <strong>Mr Safi</strong></footer>
</div>

<script>
let imgUrl="";
function saveKey(){
const k=document.getElementById("keyIn").value.trim();
if(!k){alert("Paste your hf_... token first!");return;}
try{localStorage.setItem("hf_betta_k",k);}catch(e){}
document.getElementById("badge").innerText="KEY READY";
document.getElementById("badge").classList.add("ok");
document.getElementById("saveBtn").innerText="Saved ✓";
document.getElementById("saveBtn").classList.add("ok");
document.getElementById("st").innerText="KEY SAVED • TAP GENERATE";
}
try{const sk=localStorage.getItem("hf_betta_k");if(sk){document.getElementById("keyIn").value=sk;saveKey();}}catch(e){}
function setRatio(){
const r=document.getElementById("rSel").value,s=document.getElementById("scr");
document.getElementById("hudR").innerText=r+" RAW";
s.className="screen"+(r==="1:1"?" r1":r==="4:5"?" r4":"");
}
function chkM(){document.getElementById("modeTxt").innerText=document.getElementById("cIn").value.trim()?"Custom Scene Mode • FLUX.1 RAW":"Betta Splendens Macro • 8K RAW";}
function clrP(){document.getElementById("cIn").value="";chkM();}
async function runGen(retry){
const k=document.getElementById("keyIn").value.trim();
if(!k){alert("Paste your hf_... token first!");return;}
saveKey();
const c=document.getElementById("cIn").value.trim();
const prompt=c?c+", ultra-realistic 8K RAW photography, cinematic studio lighting":"Award-winning National Geographic macro wildlife photograph of a single "+document.getElementById("vSel").value+" with "+document.getElementById("cSel").value+", side-profile view in crystal-clear water, "+document.getElementById("lSel").value+", razor-sharp scales and translucent fin rays, 100mm macro f/2.8";
const go=document.getElementById("goBtn"),st=document.getElementById("st"),dot=document.getElementById("dot");
go.disabled=true;go.innerText="CAPTURING...";dot.classList.add("pulse");
document.getElementById("pic").classList.add("hide");document.getElementById("ph").classList.remove("hide");
st.innerText=retry?"GPU READY • RENDERING 8K BETTA...":"EXPOSING FLUX.1 SENSOR...";
try{
const res=await fetch("https://router.huggingface.co/hf-inference/models/black-forest-labs/FLUX.1-schnell",{
method:"POST",headers:{"Authorization":"Bearer "+k,"Content-Type":"application/json"},
body:JSON.stringify({inputs:prompt})
});
if(res.status===503&&!retry){st.innerText="WAKING GPU (8s)...";setTimeout(()=>runGen(true),8000);return;}
if(!res.ok){const t=await res.text();throw new Error("HTTP "+res.status+" "+t.slice(0,60));}
const blob=await res.blob();
if(imgUrl)URL.revokeObjectURL(imgUrl);
imgUrl=URL.createObjectURL(blob);
document.getElementById("pic").src=imgUrl;
document.getElementById("ph").classList.add("hide");document.getElementById("pic").classList.remove("hide");
}catch(e){st.innerText="ERROR: "+e.message;}
finally{go.disabled=false;go.innerText="GENERATE";dot.classList.remove("pulse");}
}
function dlImg(){if(!imgUrl){alert("Generate an image first!");return;}const a=document.createElement("a");a.href=imgUrl;a.download="Betta-MrSafi-"+Date.now()+".jpg";a.click();}
function cpMot(){navigator.clipboard.writeText("Ultra slow-motion 60fps underwater macro video of this Betta fish, delicate silk fins rippling gracefully, floating micro-bubbles, 100mm macro lens.").then(()=>{const b=document.getElementById("cpBtn");b.innerText="✅ Copied!";setTimeout(()=>b.innerText="📋 Motion",1500);});}
</script>
</body>
    </html>
